name: Wholesale backend patch

on:
  push:
    branches:
      - fix/wholesale-layout-checkout-20260821
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    if: ${{ !contains(github.event.head_commit.message || '', '[wholesale-app-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/wholesale-layout-checkout-20260821
          fetch-depth: 0

      - name: Apply guarded app patch
        run: node scripts/patch-wholesale-app.js

      - name: Syntax check
        run: node --check app.js

      - name: Commit patched app
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Enable wholesale pricing in cart and checkout [wholesale-app-patched]"
          git push origin HEAD:fix/wholesale-layout-checkout-20260821
